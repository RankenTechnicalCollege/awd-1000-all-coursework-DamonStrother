            <p>Meet our friends in need.</p>

        <!-- Figure element 1 -->
        <figure>
            <img src="images/blind-deer.jpg" alt="blind deer">
            <figcaption>Russ is a blind deer. He was brought to us by a hunter who found him wandering in circles.</figcaption>
        </figure>

        <!-- Figure element 2 -->
        <figure>
            <img src="images/baby-squirrel.jpg" alt="baby squirrel on a tree">
            <figcaption>Meet Nugget. He is learning how to climb trees and will be released when he is ready.</figcaption>
        </figure>

        <!-- Figure element 3 -->
        <figure>
            <img src="images/cow.jpg" alt="face of a cow">
            <figcaption>This is Ellie. She was neglected and malnourished when she was rescued.</figcaption>
        </figure>

        <!-- Figure element 4 -->
        <figure>
            <img src="images/goat.jpg" alt="goat laying in the grass">
            <figcaption>Say hi to Vinny. His back legs were injured, making it difficult for him to get around.</figcaption>
        </figure>

        <!-- Figure element 5 -->
        <figure>
            <img src="images/pig.jpg" alt="pig standing">
            <figcaption>Rosie was just a baby when she arrived. Now she has babies of her own.</figcaption>
        </figure>

        <!-- Figure element 6 -->
        <figure>
            <img src="images/bird.jpg" alt="bird resting">
            <figcaption>This bird is receiving care while it recovers.</figcaption>
        </figure>

        <!-- Figure element 7 -->
        <figure>
            <img src="images/dog.jpg" alt="dog sitting outdoors">
            <figcaption>This animal is being cared for while its situation is assessed.</figcaption>
        </figure>

        <!-- Figure element 8 -->
        <figure>
            <img src="images/cat.jpg" alt="cat looking toward the camera">
            <figcaption>Our team makes sure every animal receives appropriate attention.</figcaption>
        </figure>

        <!-- Figure element 9 -->
        <figure>
            <img src="images/hedgehog.jpg" alt="hedgehog">

        </figure>

        <!-- Figure element 10 -->
        <figure>
            <img src="images/tortoise.jpg" alt="tortoise">
            <figcaption>This tortoise is one of the animals featured in our rescue work.</figcaption>
        </figure>

        <!-- Figure element 11 -->
        <figure>
            <img src="images/raccoon.jpg" alt="raccoon">
            <figcaption>This raccoon is receiving care from the Wild Rescues team.</figcaption>
        </figure>

        <!-- Figure element 12 -->
        <figure>
            <img src="images/baby-hawk.jpg" alt="rescued baby hawk">
