<!DOCTYPE html>
<!-- Damon Strother, 10/22/2026 -->
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
        crossorigin="anonymous">

    <title>NYC Highlights | Extend Your Knowledge 12</title>
</head>

<body>

    <!-- Bootstrap Jumbotron -->
    <header class="jumbotron jumbotron-fluid text-center mb-0">
        <div class="container">
            <h1 class="display-3">New York City Views</h1>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="container my-5">

        <!-- Bootstrap Carousel -->
        <div id="nycCarousel" class="carousel slide" data-ride="carousel">

            <!-- Carousel Indicators -->
            <ol class="carousel-indicators">
                <li data-target="#nycCarousel" data-slide-to="0" class="active"></li>
                <li data-target="#nycCarousel" data-slide-to="1"></li>
                <li data-target="#nycCarousel" data-slide-to="2"></li>
            </ol>

            <!-- Carousel Images -->
            <div class="carousel-inner">

                <!-- First Slide -->
                <div class="carousel-item active">
                    <img src="https://images.unsplash.com/photo-1534430480872-3498386e7856?auto=format&fit=crop&w=1200&q=80"
                        class="d-block w-100" alt="New York City skyline">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>New York City Skyline</h5>
                        <p>Enjoy the amazing views of the city.</p>
                    </div>
                </div>

                <!-- Second Slide -->
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1496588152823-86ff7695e68f?auto=format&fit=crop&w=1200&q=80"
                        class="d-block w-100" alt="New York City buildings">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>City Architecture</h5>
                        <p>Discover the famous buildings of New York.</p>
                    </div>
                </div>

                <!-- Third Slide -->
                <div class="carousel-item">
                    <img src="https://images.unsplash.com/photo-1518391846015-55a9cc003b25?auto=format&fit=crop&w=1200&q=80"
                        class="d-block w-100" alt="New York City streets">
                    <div class="carousel-caption d-none d-md-block">
                        <h5>Explore New York</h5>
                        <p>Experience the energy of the city.</p>
                    </div>
                </div>

            </div>

            <!-- Previous Button -->
            <a class="carousel-control-prev" href="#nycCarousel"
                role="button" data-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="sr-only">Previous</span>
            </a>

            <!-- Next Button -->
            <a class="carousel-control-next" href="#nycCarousel"
                role="button" data-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="sr-only">Next</span>
            </a>

        </div>
        <!-- End Bootstrap Carousel -->

    </main>

    <!-- Footer -->
    <footer class="jumbotron-fluid text-center bg-dark p-2">
        <div class="container text-white">
          <p>&copy; Copyright 2021. All Rights Reserved.</p>
          <p>Webpage Created by: Damon Strother</p>
        </div>
    </footer>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>

</body>
</html>
