<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Challenges</title>
  <script src="script.js" defer></script>
</head>

<body>

  <header>
    <h1>JavaScript Challenges</h1>
  </header>

  <main>

    <!-- Challenge 1: Favorite Movie List -->
    <section>
      <h2>Challenge 1: Favorite Movie List</h2>

      <label for="movie">Enter your favorite movie:</label>
      <input type="text" id="movie">

      <button type="button" onclick="addMovie()">Add Movie</button>

      <ul id="movieList"></ul>
    </section>


    <!-- Challenge 2: Age Verification -->
    <section>
      <h2>Challenge 2: Age Verification</h2>

      <label for="age">Enter your age:</label>
      <input type="text" id="age">

      <button type="button" onclick="verifyAge()">Verify Age</button>

      <p id="ageMessage"></p>
    </section>


    <!-- Challenge 3: Song Lyrics -->
    <section>
      <h2>Challenge 3: Song Lyrics</h2>

      <label for="number">Enter a number from 1-3:</label>
      <input type="text" id="number">

      <button type="button" onclick="showLyrics()">Submit</button>

      <p id="lyrics"></p>
    </section>


    <!-- Challenge 4: Odd Numbers -->
    <section>
      <h2>Challenge 4: Odd Numbers</h2>

      <p id="oddNumbers"></p>
    </section>


    <!-- Challenge 5: Multiples of X -->
    <section>
      <h2>Challenge 5: Multiples of X</h2>

      <p id="multiples"></p>
    </section>

  </main>

</body>

</html>
